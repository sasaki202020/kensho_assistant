<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Address Mock Form</title></head>
<body>
  <form action="submitted.html" method="get">
    <label>氏名 <input name="full_name" required></label>
    <label>郵便番号 <input name="postal_code" required></label>
    <label>都道府県 <input name="prefecture" required></label>
    <label>住所 <input name="address" required></label>
    <label>電話番号 <input name="phone" type="tel"></label>
    <button type="submit">送信</button>
  </form>
</body>
</html>
