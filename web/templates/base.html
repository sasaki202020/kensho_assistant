<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title or "懸賞応募アシスタント" }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-title">懸賞応募アシスタント</div>
        <div class="brand-subtitle">安全に応募準備</div>
      </div>
      <nav class="nav">
        {% for key, label, href in nav_items %}
        <a class="nav-item {% if active_page == key %}active{% endif %}" href="{{ href }}">{{ label }}</a>
        {% endfor %}
      </nav>
      <div class="sidebar-footer">
        <div>安全モード ON</div>
        <div>本番送信は人間確認が必要</div>
      </div>
    </aside>
    <main class="main">
      <header class="hero">
        <div>
          <h1>{{ page_title or "ダッシュボード" }}</h1>
          <p>本番送信は人間確認が必要です。自動送信は無効です。</p>
        </div>
      </header>
      {% block content %}{% endblock %}
      <footer class="footer">
        <div>本番送信は人間確認が必要です</div>
        <div>自動送信は無効です</div>
      </footer>
    </main>
  </div>
  <script>
    document.addEventListener("submit", function (event) {
      var form = event.target;
      if (!form || form.dataset.noLoading === "true") return;
      var button = form.querySelector("button[type='submit']");
      if (!button || button.disabled) return;
      window.setTimeout(function () {
        button.dataset.originalText = button.textContent;
        button.textContent = button.dataset.loadingText || "処理中...";
        button.classList.add("is-loading");
        button.disabled = true;
      }, 0);
    });
  </script>
</body>
</html>
