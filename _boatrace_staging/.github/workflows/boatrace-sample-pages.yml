name: 競艇AI ページ採取(パーサー検証用)

# 公式サイトの実HTMLを採取し、パーサーのテストフィクスチャとして
# リポジトリへコミットする。サイト改修でパーサーが壊れた際の調査に使う。
on:
  push:
    paths:
      - '.github/workflows/boatrace-sample-pages.yml'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日 YYYYMMDD'
        required: true
      jcd:
        description: '場コード(2桁)'
        required: false
        default: '01'
      rno:
        description: 'レース番号'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ページ取得
        run: |
          DEST="tests/fixtures/real_pages/${{ inputs.date || '20260610' }}_${{ inputs.jcd || '01' }}_${{ inputs.rno || '1' }}"
          mkdir -p "$DEST"
          for page in racelist beforeinfo raceresult oddstf; do
            curl -sL --max-time 30 \
              -A 'kensho-boat-race-ai/1.0 (research; contact: goooo1002@gmail.com)' \
              "https://www.boatrace.jp/owpc/pc/race/${page}?rno=${{ inputs.rno || '1' }}&jcd=${{ inputs.jcd || '01' }}&hd=${{ inputs.date || '20260610' }}" \
              -o "$DEST/${page}.html" \
              -w "${page}: HTTP %{http_code} %{size_download}B\n"
            sleep 2
          done
          ls -la "$DEST"
      - name: コミット
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/real_pages
          if git diff --cached --quiet; then
            echo '変更なし'
          else
            git commit -m "実ページサンプルを追加: ${{ inputs.date || '20260610' }} jcd=${{ inputs.jcd || '01' }} ${{ inputs.rno || '1' }}R"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pages-${{ inputs.date || '20260610' }}-${{ inputs.jcd || '01' }}-${{ inputs.rno || '1' }}
          path: tests/fixtures/real_pages
