<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>懸賞入力補助 - セキュリティ設定</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>セキュリティ設定</h1>
    <p>プロフィールはこの画面へ入力しません。応募準備中にローカルアプリから一回限りのbridgeで必要項目だけ受け取ります。</p>
    <div class="actions">
      <button type="button" id="clear">一時セッション情報を消去</button>
      <button type="button" id="reload-extension">拡張機能を更新</button>
    </div>
    <p id="status" role="status">bridge-onlyモード</p>
    <p class="note">パスワード、認証コード、Cookie、自由記述は受け取りません。最終送信と規約同意は拡張機能では行いません。</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
