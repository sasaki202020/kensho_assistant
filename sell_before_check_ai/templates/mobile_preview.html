<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>売る前チェック | モバイルプレビュー</title>
<style>
  body { margin: 0; background: #2b2f33; font-family: system-ui, sans-serif; color: #eee;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; }
  .switch { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .switch a { color: #cde; text-decoration: none; padding: 6px 12px; border-radius: 14px; background: #444a50; font-size: 13px; }
  .switch a.on { background: #0f6e5d; color: #fff; }
  .phone { width: 393px; height: 760px; border-radius: 44px; border: 10px solid #111;
           overflow: hidden; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .phone iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<h1>モバイルプレビュー (iPhone幅 393px)</h1>
<div class="switch">
  {% for key, path in views.items() %}
  <a href="/mobile-preview?view={{ key }}" class="{{ 'on' if key == view else '' }}">{{ key }}</a>
  {% endfor %}
</div>
<div class="phone"><iframe src="{{ target }}" title="アプリ画面プレビュー"></iframe></div>
</body>
</html>
