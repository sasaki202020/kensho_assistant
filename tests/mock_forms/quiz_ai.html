<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Quiz AI Mock Form</title></head>
<body>
  <form action="submitted.html" method="get">
    <div class="quiz">
      <p>クイズ: このページで紹介されている福岡県の特産品はどれですか。</p>
      <p>ヒント: 福岡県産の農林水産物</p>
      <p>選択肢</p>
      <p>福岡県</p>
      <p>佐賀県</p>
      <p>熊本県</p>
      <label>クイズの回答
        <select name="quiz_answer" required>
          <option value="">選択してください</option>
          <option value="fukuoka">福岡県</option>
          <option value="saga">佐賀県</option>
          <option value="kumamoto">熊本県</option>
        </select>
      </label>
    </div>
    <button type="submit">送信</button>
  </form>
</body>
</html>
