<!doctype html>
<html lang="ja">
  <body>
    <header>
      <form id="site-search" action="/search" method="get">
        <label for="search-query">サイト内検索</label>
        <input id="search-query" name="q" type="search" placeholder="検索キーワード">
      </form>
      <form id="newsletter" action="/newsletter" method="post">
        <label for="newsletter-email">メール配信登録</label>
        <input id="newsletter-email" name="newsletter_email" type="email">
      </form>
    </header>
    <main>
      <form id="application-form" action="/apply" method="post">
        <label for="last-name">姓</label>
        <input id="last-name" name="last_name" autocomplete="family-name" required>
        <label for="first-name">名</label>
        <input id="first-name" name="first_name" autocomplete="given-name" required>
        <label for="application-email">メールアドレス</label>
        <input id="application-email" name="email" type="email" autocomplete="email" required>
        <button type="submit">応募する</button>
      </form>
    </main>
    <footer>
      <input id="footer-tracking" name="tracking_code" type="text" value="">
    </footer>
  </body>
</html>
