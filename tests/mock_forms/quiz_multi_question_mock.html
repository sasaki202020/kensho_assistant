<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Quiz Multi Question Mock</title></head>
<body>
  <form action="submitted.html" method="get">
    <div class="quiz">
      <p>クイズ1: 福岡県の特産品はどれでしょうか。</p>
      <label>回答1
        <select name="quiz_answer_1" required>
          <option value="">選択してください</option>
          <option value="amagou">あまおう</option>
          <option value="motsunabe">もつ鍋</option>
        </select>
      </label>
    </div>
    <div class="quiz">
      <p>クイズ2: 次のうち正しい応募区分はどれでしょうか。</p>
      <label>回答2
        <select name="quiz_answer_2" required>
          <option value="">選択してください</option>
          <option value="general">一般</option>
          <option value="student">学生</option>
        </select>
      </label>
    </div>
    <button type="submit">送信する</button>
  </form>
</body>
</html>
