<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Required Checkbox Mock</title></head>
<body>
  <form action="submitted.html" method="get">
    <label>メールアドレス <input name="email" type="email" required></label>
    <label><input type="checkbox" name="agree_terms" required>応募規約に同意</label>
    <label><input type="checkbox" name="agree_privacy" required>個人情報の取り扱いに同意</label>
    <label><input type="checkbox" name="agree_condition" required>応募条件を確認し同意します</label>
    <button type="submit">応募する</button>
  </form>
</body>
</html>
