<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Select Mock Form</title></head>
<body>
  <form action="submitted.html" method="get">
    <label>お名前 <input id="name" name="name" required autocomplete="name"></label>
    <label>メールアドレス <input id="email" name="email" type="email" required autocomplete="email"></label>

    <label>都道府県
      <select name="prefecture" required>
        <option value="">選択してください</option>
        <option>東京都</option>
        <option>神奈川県</option>
      </select>
    </label>

    <label>年代
      <select name="age_group">
        <option value="">選択してください</option>
        <option>20代</option>
        <option>30代</option>
      </select>
    </label>

    <label>職業
      <select name="occupation">
        <option value="">選択してください</option>
        <option>会社員</option>
        <option>自営業</option>
      </select>
    </label>

    <fieldset>
      <legend>既婚/未婚</legend>
      <label><input type="radio" name="marital_status" value="未婚">未婚</label>
      <label><input type="radio" name="marital_status" value="既婚">既婚</label>
    </fieldset>

    <fieldset>
      <legend>子どもの有無</legend>
      <label><input type="radio" name="children" value="なし">なし</label>
      <label><input type="radio" name="children" value="あり">あり</label>
    </fieldset>

    <label>簡単な選択式アンケート
      <select name="survey_choice">
        <option value="">選択してください</option>
        <option>A</option>
        <option>B</option>
      </select>
    </label>

    <label>プレゼント選択
      <select name="prize_choice">
        <option value="">選択してください</option>
        <option>1</option>
        <option>2</option>
      </select>
    </label>

    <label>応募口数
      <select name="entry_count">
        <option value="">選択してください</option>
        <option>1</option>
        <option>2</option>
      </select>
    </label>

    <button id="submit" type="submit">送信</button>
  </form>
</body>
</html>
