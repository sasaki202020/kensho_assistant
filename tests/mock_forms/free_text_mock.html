<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Free Text Mock</title></head>
<body>
  <form action="submitted.html" method="get">
    <p>ご意見、ご感想、応募理由を自由にお書きください。</p>
    <label>応募理由
      <textarea name="free_text" required></textarea>
    </label>
    <label>ご感想
      <textarea name="opinion"></textarea>
    </label>
    <label>希望コメント
      <textarea name="comment"></textarea>
    </label>
    <button type="submit">送信する</button>
  </form>
</body>
</html>
