<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Multi Radio Mock Form</title></head>
<body>
  <form action="submitted.html" method="get">
    <fieldset>
      <legend>性別</legend>
      <label><input type="radio" name="gender" value="male" required>男性</label>
      <label><input type="radio" name="gender" value="female" required>女性</label>
    </fieldset>
    <fieldset>
      <legend>既婚/未婚</legend>
      <label><input type="radio" name="marital_status" value="single" required>未婚</label>
      <label><input type="radio" name="marital_status" value="married" required>既婚</label>
    </fieldset>
    <fieldset>
      <legend>子どもの有無</legend>
      <label><input type="radio" name="children" value="none" required>なし</label>
      <label><input type="radio" name="children" value="yes" required>あり</label>
    </fieldset>
    <button type="submit">送信</button>
  </form>
</body>
</html>
