<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>表見出し応募フォーム</title>
<form id="application-form">
  <table>
    <tr><th>氏名</th><td><input name="氏名"></td></tr>
    <tr><th>フリガナ</th><td><input name="フリガナ"></td></tr>
    <tr><th>生年月日</th><td>
      <input name="誕生年"><select name="誕生月"><option value="4">4</option></select>
      <select name="誕生日"><option value="1">1</option></select>
    </td></tr>
    <tr><th>郵便番号</th><td><input name="郵便番号1"><input name="郵便番号2"></td></tr>
    <tr><th>住所</th><td><input name="県名"><input name="住所"></td></tr>
    <tr><th>電話番号</th><td><input name="電話番号"></td></tr>
    <tr><th>メールアドレス</th><td><input name="メールアドレス"></td></tr>
    <tr><th>メール配信</th><td><input type="radio" name="メールの希望" value="yes"></td></tr>
  </table>
</form>
