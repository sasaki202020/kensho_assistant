<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>危険項目fixture</title>
<form>
  <label>メールアドレス <input name="email" type="email" autocomplete="email"></label>
  <label>メールアドレス（確認） <input name="email_confirmation" type="email"></label>
  <label>パスワード <input name="password" type="password"></label>
  <label>本人確認書類 <input name="identity_document" type="file"></label>
  <label>カード番号 <input name="card_number" autocomplete="cc-number"></label>
  <label>秘密の質問 <input name="secret_question"></label>
  <label>応募理由 <textarea name="reason"></textarea></label>
  <label>読取専用 <input name="readonly_value" readonly value="fixed"></label>
  <label>無効 <input name="disabled_value" disabled></label>
  <input type="hidden" name="website" value="">
  <label><input type="checkbox" name="terms">規約に同意する</label>
  <button type="submit">送信</button>
</form>
