<!doctype html>
<html lang="ja">
  <body>
    <form id="mapping-form">
      <label>お名前 必須 <input id="applicant-name" name="name" autocomplete="name" required></label>
      <label>保護者名 <input id="guardian-name" name="guardian_name"></label>
      <label>住所1 <input id="address-line-1" name="address1" autocomplete="address-line1" required></label>
      <label>住所2（建物名） <input id="address-line-2" name="address2" autocomplete="address-line2"></label>
      <label>メールアドレス <input id="email" name="email" type="email" autocomplete="email"></label>
      <input id="honeypot" name="website" type="hidden">
      <textarea id="comment" name="comment">既存コメント</textarea>
      <button id="submit-button" type="submit">応募する</button>
    </form>
    <script>
      document.querySelector("#email").addEventListener("input", (event) => {
        if (event.isTrusted === false) event.target.value = "";
      });
    </script>
  </body>
</html>
