<!doctype html>
<html lang="ja">
  <body>
    <form id="controlled-form">
      <label>メールアドレス <input id="email" name="email" type="email" autocomplete="email"></label>
      <label>電話番号 <input id="phone" name="phone" type="tel" autocomplete="tel"></label>
      <button id="submit-button" type="submit">応募する</button>
    </form>
    <script>
      const state = {email: "", phone: ""};
      const email = document.querySelector("#email");
      const phone = document.querySelector("#phone");
      function render() {
        email.value = state.email;
        phone.value = state.phone;
      }
      email.addEventListener("input", (event) => {
        state.email = event.target.value;
        setTimeout(render, 10);
      });
      phone.addEventListener("input", (event) => {
        state.phone = event.target.value;
        event.target.value = "";
      });
    </script>
  </body>
</html>
