<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>rtc iframe fixture</title></head>
<body><input id="email">
<script>
  const frame = document.createElement("iframe");
  document.body.appendChild(frame);
  const Fresh = frame.contentWindow.RTCPeerConnection;
  window.peer = new Fresh();
  frame.remove();
</script>
</body></html>
