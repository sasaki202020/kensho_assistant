<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>Phase 5A fixture form</title>
<form id="entry-form">
  <label>姓 <input name="last_name" autocomplete="family-name"></label>
  <label>名 <input name="first_name" autocomplete="given-name"></label>
  <label>メールアドレス <input name="email" type="email" autocomplete="email"></label>
  <label>電話番号 <input name="phone" type="tel" autocomplete="tel"></label>
  <label><input id="terms" type="checkbox" name="terms"> 利用規約に同意する</label>
  <button id="submit-button" type="submit">応募する</button>
</form>
